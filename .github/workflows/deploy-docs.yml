name: Deploy docs

# Publishes https://docs.corevalley.ai/. The site is not built from this
# repository: it is the docs build of CoreValleyAI/redesigned-portal
# (`npm run build:docs`, Markdown in corevalley-docs/). This workflow checks
# that repository's main every 15 minutes and rebuilds when it has moved
# since the last deploy (build-sha.txt on the live site). Run it by hand
# (Actions → Deploy docs → Run workflow) to publish at once; `ref` builds a
# branch or commit instead of main.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of CoreValleyAI/redesigned-portal to build
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write
  # Re-enabling this workflow below keeps GitHub from switching the schedule
  # off after 60 days without commits here.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_REPO: CoreValleyAI/redesigned-portal
  SITE_URL: https://docs.corevalley.ai
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - name: Resolve source commit
        id: source
        env:
          REF: ${{ inputs.ref || 'main' }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(git ls-remote "https://github.com/$SOURCE_REPO" "refs/heads/$REF" "refs/tags/$REF" | head -1 | cut -f1)
          [ -n "$sha" ] || sha="$REF"
          live=$(curl -fsSL "$SITE_URL/build-sha.txt" 2>/dev/null | tr -d '[:space:]' || true)
          echo "source $REF = $sha, live = ${live:-none}"
          build=true
          if [ "$EVENT" = "schedule" ] && [ "$sha" = "$live" ]; then build=false; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy-docs.yml/enable" || true

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ env.SOURCE_REPO }}
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs site
        run: npm run build:docs
        env:
          DOCS_SITE_URL: ${{ env.SITE_URL }}

      - name: Record the source commit
        run: echo "${{ needs.check.outputs.sha }}" > out-docs/build-sha.txt

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell IndexNow engines (Bing, Yandex, Seznam, Naver…) the docs changed.
      # The key file ships in the build (public/<key>.txt in the source repo).
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_KEY: 33ff8a51559595949e0134533bfcd08b
        run: |
          urls="$(curl -fsS "$SITE_URL/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)"
          body="$(jq -nc --arg host "${SITE_URL#https://}" --arg key "$INDEXNOW_KEY" --arg loc "$SITE_URL/$INDEXNOW_KEY.txt" --argjson urls "$urls" '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')"
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow -H 'content-type: application/json; charset=utf-8' --data "$body"
